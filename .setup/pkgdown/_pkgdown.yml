destination: pkgdown
url: https://github.com/jeksterslab/betaDelta/

template:
  package: rProject

reference:
- title: Standardized Regression Coefficients
  contents:
  - has_keyword("std")
- title: Differences of Standardized Regression Coefficients
  contents:
  - has_keyword("diff")
- title: R-Squared
  contents:
  - has_keyword("rsq")
- title: Semipartial and Squared Partial Correlations
  contents:
  - has_keyword("scor")
  - has_keyword("pcor")
- title: Improvement in R-Squared and Cohen's f-Squared
  contents:
  - has_keyword("deltarsq")
  - has_keyword("fsq")
- title: Delta Method (General)
  contents:
  - has_keyword("deltaMethod")
- title: Methods
  contents:
  - has_keyword("methods")
- title: Data
  contents:
  - has_keyword("data")

articles:
- title: Examples
  contents:
  - example-beta-delta
  - example-diff-beta-delta
  - example-es-delta
  - example-delta
  - example-delta-generic
- title: Session Information
  contents:
  - session
